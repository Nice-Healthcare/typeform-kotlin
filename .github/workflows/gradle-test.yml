name: Gradle Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  Test-Analyze:

    runs-on: ubuntu-latest

    permissions:
#      actions: read # CodeQL
      contents: read # Test Results (private repo); CodeQL
      issues: read  # Test Results (private repos)
      checks: write # Test Results
      pull-requests: write # Test Results
#      security-events: write # CodeQL

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'liberica'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Test with Gradle
      shell: bash
      run: |
        ./gradlew testDebugUnitTest
        ./gradlew testAndroidHostTest

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: |
          typeform/build/test-results/testDebugUnitTest/*.xml
          typeform/build/test-results/testAndroidHostTest/*.xml

